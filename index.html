<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Million Goal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #f0f0f0);
            --tg-card: var(--tg-theme-secondary-bg-color, #ffffff);
            --tg-text: var(--tg-theme-text-color, #222222);
            --tg-hint: var(--tg-theme-hint-color, #8e8e93);
            --tg-link: var(--tg-theme-button-color, #007aff);
            --success: #34c759;
            --warning: #ff9500;
            --error: #ff3b30;
        }

        body, html {
            height: 100%; margin: 0; padding: 0;
            background: linear-gradient(135deg, #e0e0e0 0%, #ffffff 100%);
            color: var(--tg-text);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }

        .wrapper {
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            height: 100vh; width: 100%;
            padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
            box-sizing: border-box;
        }

        .card {
            background: var(--tg-card);
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 20px; padding: 16px;
            margin-bottom: 10px; width: 100%; max-width: 400px;
            box-sizing: border-box; flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 10px;
        }

        .mini-card {
            background: var(--tg-card);
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 18px;
            padding: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .label { color: var(--tg-hint); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .balance { font-size: 28px; font-weight: 800; margin: 2px 0; cursor: pointer; }

        .progress-track { height: 6px; background: rgba(0,0,0,0.05); border-radius: 3px; overflow: hidden; margin: 10px 0 4px; }
        .progress-track.mini { height: 3px; margin: 0 0 10px; opacity: 0.8; }
        .progress-bar { height: 100%; width: 0%; transition: width 0.8s, background-color 0.4s; }
        .progress-bar.stage { background-color: var(--tg-link); }

        .dots { display: flex; gap: 4px; margin-top: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(0,0,0,0.08); position: relative; overflow: hidden; }
        .dot-fill { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: var(--success); transition: height 0.3s; }

        .dice { font-size: 44px; text-align: center; margin: 2px 0; line-height: 1; }
        
        .input-sum {
            width: 100%; 
            background: rgba(0,0,0,0.03) !important; 
            border: 1px solid rgba(0,0,0,0.1); 
            border-radius: 12px;
            padding: 14px; 
            color: var(--tg-text) !important; 
            font-size: 24px; 
            font-weight: 700;
            text-align: center; 
            margin-bottom: 10px; 
            outline: none; 
            box-sizing: border-box;
            -webkit-appearance: none;
        }
        .input-sum:focus { border-color: var(--tg-link); background: #ffffff !important; }

        .btn { border: none; border-radius: 14px; padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; transition: opacity 0.2s; }
        .btn:active { opacity: 0.7; }
        .btn-main { background: var(--tg-link); color: #fff; }
        .btn-split { background: var(--warning); color: #fff; margin-bottom: 8px; }
        .btn-skip { background: rgba(0,0,0,0.05); color: var(--tg-link); }

        .hidden { display: none !important; }
        .hist-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 0.5px solid rgba(0,0,0,0.05); font-size: 13px; }
        .c-green { color: var(--success); } .c-red { color: var(--error); } .c-orange { color: var(--warning); }
        
        .btn-more {
            background: none; border: none; color: var(--tg-link); width: 100%;
            padding: 10px 0 0; font-size: 13px; font-weight: 600; cursor: pointer;
        }

        #win-splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--tg-bg); z-index: 1000; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px; box-sizing: border-box;
        }
    </style>
</head>
<body>

<div id="win-splash" class="hidden" onclick="secretReset()">
    <div style="font-size: 64px; margin-bottom: 20px;">🏆</div>
    <h1 style="margin: 0;">МИЛЛИОН НАКОПЛЕН!</h1>
    <p style="color: var(--tg-hint); margin-top: 10px;">Вы достигли цели. Нажмите, чтобы начать сначала.</p>
</div>

<div class="wrapper" id="main-ui">
    <div class="card">
        <div style="display:flex; justify-content:space-between;">
            <div class="label" id="ui-day">День 1 / 40</div>
            <div class="label" id="ui-pct">0/100к</div>
        </div>
        <div class="balance" id="ui-saved" onclick="secretReset()">0 ₽</div>
        <div class="progress-track"><div class="progress-bar" id="ui-bar"></div></div>
        <div class="progress-track mini"><div class="progress-bar stage" id="ui-bar-stage"></div></div>
    </div>

    <div class="status-grid">
        <div class="mini-card">
            <div class="label">Жизни</div>
            <div style="font-size:18px; font-weight:800; margin-top:2px;">❤️ <span id="ui-lives">3</span></div>
            <div class="dots" id="ui-dots"></div>
        </div>
        <div class="mini-card" style="text-align: right; align-items: flex-end;">
            <div class="label">Текущий Этап</div>
            <div style="font-size:18px; font-weight:800; margin-top:2px;" id="ui-stage-text">1 / 10</div>
            <div class="label" id="ui-frag-val" style="margin-top:6px; font-size:9px;">Защита 0.00</div>
        </div>
    </div>

    <div class="card" id="game-card"></div>

    <div class="card" id="hist-card">
        <div class="label" style="margin-bottom:6px;">История действий</div>
        <div id="ui-hist"></div>
        <button id="btn-more" class="btn-more hidden" onclick="loadMore()">Показать еще 7 дней</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const GOAL = 1000000, STAGE_GOAL = 100000, DAYS = 400, STAGE_DAYS = 40, FRAGS_PER_LIFE = 6;
    let s = { day: 1, saved: 0, totalFrags: 18.0, roll: null, sug: 0, isSplit: false, history: [] };
    let histLimit = 7;

    const dotsContainer = document.getElementById('ui-dots');
    dotsContainer.innerHTML = Array(6).fill('<div class="dot"><div class="dot-fill"></div></div>').join('');

    async function load() {
        tg.CloudStorage.getItem('m_goal_v41', (err, val) => {
            if(!err && val) s = JSON.parse(val);
            checkWin();
            render();
        });
    }

    function save() { tg.CloudStorage.setItem('m_goal_v41', JSON.stringify(s)); }

    function secretReset() {
        tg.showConfirm("Сбросить весь прогресс?", (ok) => {
            if(ok) {
                tg.HapticFeedback.notificationOccurred('warning');
                s = { day: 1, saved: 0, totalFrags: 18.0, roll: null, sug: 0, isSplit: false, history: [] };
                document.getElementById('win-splash').classList.add('hidden');
                document.getElementById('main-ui').classList.remove('hidden');
                save(); render();
            }
        });
    }

    function checkWin() {
        if (s.saved >= GOAL) {
            document.getElementById('win-splash').classList.remove('hidden');
            document.getElementById('main-ui').classList.add('hidden');
        }
    }

    function fireConfetti() {
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#007aff', '#34c759', '#ff9500'] });
    }

    function loadMore() {
        tg.HapticFeedback.impactOccurred('light');
        histLimit += 7;
        render();
    }

    function render() {
        const lives = Math.floor(s.totalFrags / FRAGS_PER_LIFE);
        const rem = (s.totalFrags % FRAGS_PER_LIFE);
        
        const currentStage = Math.floor(s.saved / STAGE_GOAL);
        const stageSaved = s.saved % STAGE_GOAL;
        const stageDay = ((s.day - 1) % STAGE_DAYS) + 1;
        
        document.getElementById('ui-day').innerText = `День ${stageDay} / 40`;
        document.getElementById('ui-saved').innerText = s.saved.toLocaleString() + ' ₽';
        document.getElementById('ui-lives').innerText = lives;
        document.getElementById('ui-stage-text').innerText = `${currentStage + 1} / 10`;
        document.getElementById('ui-frag-val').innerText = `Защита ${rem.toFixed(2)}`;
        document.getElementById('ui-pct').innerText = `${Math.floor(stageSaved/1000)}к / 100к`;
        
        const totalPct = (s.saved / GOAL) * 100;
        const stagePct = (stageSaved / STAGE_GOAL) * 100;
        
        const bar = document.getElementById('ui-bar');
        bar.style.width = Math.min(totalPct, 100) + '%';
        
        const idealPct = (s.day / DAYS) * 100;
        bar.style.backgroundColor = totalPct > idealPct + 0.1 ? 'var(--success)' : (totalPct < idealPct - 0.1 ? 'var(--error)' : 'var(--tg-link)');

        document.getElementById('ui-bar-stage').style.width = Math.min(stagePct, 100) + '%';

        document.querySelectorAll('.dot-fill').forEach((f, i) => {
            let v = rem - i;
            f.style.height = v >= 1 ? '100%' : (v > 0 ? (v * 100) + '%' : '0%');
        });

        const histCard = document.getElementById('hist-card');
        if (s.roll) histCard.classList.add('hidden');
        else histCard.classList.remove('hidden');

        const gc = document.getElementById('game-card');
        if(!s.roll) {
            gc.innerHTML = `<button class="btn btn-main" onclick="roll()">🎲 БРОСИТЬ КУБИК</button>`;
        } else {
            gc.innerHTML = `
                <div class="dice">${["", "⚀", "⚁", "⚂", "⚃", "⚄", "⚅"][s.roll]}</div>
                <input type="number" class="input-sum" id="sum-in" value="${s.sug}" inputmode="numeric">
                ${(s.sug >= 100) ? `<button class="btn btn-split" onclick="split()">✂️ СПЛИТ (-0.5 фр.)</button>` : ''}
                <div style="display:flex; gap:10px">
                    <button class="btn btn-skip" id="skip-btn" onclick="skip()">ПРОПУСК</button>
                    <button class="btn btn-main" onclick="done()">ВНЕСТИ</button>
                </div>
            `;
            document.getElementById('skip-btn').disabled = s.totalFrags < 1;
        }

        const histArr = [...s.history].reverse();
        document.getElementById('ui-hist').innerHTML = histArr.slice(0, histLimit).map(h => {
            let cls = h.t === 's' ? 'c-red' : (h.split ? 'c-orange' : (h.v >= h.orig ? 'c-green' : 'c-red'));
            return `<div class="hist-item"><span>День ${h.d}</span><span class="${cls}">${h.t === 's' ? 'Пропуск' : h.v.toLocaleString() + ' ₽'}</span></div>`;
        }).join('');

        const btnMore = document.getElementById('btn-more');
        if(histArr.length > histLimit) btnMore.classList.remove('hidden');
        else btnMore.classList.add('hidden');
    }

    function roll() {
        tg.HapticFeedback.impactOccurred('light');
        s.roll = Math.floor(Math.random() * 6) + 1;
        const avg = (GOAL - s.saved) / (DAYS + 1 - s.day);
        // Увеличен разброс для сумм до 3000
        const m = {1:0.3, 2:0.6, 3:0.9, 4:1.2, 5:1.6, 6:2.2};
        s.sug = Math.min(Math.round((avg * m[s.roll])/50)*50, 3000);
        if (s.sug < 50) s.sug = 50;
        s.isSplit = false;
        render();
    }

    function split() {
        if(s.totalFrags >= 0.5) {
            tg.HapticFeedback.notificationOccurred('warning');
            s.totalFrags = Number((s.totalFrags - 0.5).toFixed(2));
            s.sug = Math.floor(s.sug / 2);
            s.isSplit = true;
            render();
        }
    }

    function done() {
        const val = parseInt(document.getElementById('sum-in').value) || 0;
        const oldStage = Math.floor(s.saved / STAGE_GOAL);
        
        if(val >= s.sug) tg.HapticFeedback.impactOccurred('heavy');
        else tg.HapticFeedback.impactOccurred('medium');

        s.saved += val;
        s.totalFrags = Number((s.totalFrags + 0.1).toFixed(2));
        
        const newStage = Math.floor(s.saved / STAGE_GOAL);
        if (newStage > oldStage) {
            s.totalFrags += 12.0; 
            tg.HapticFeedback.notificationOccurred('success');
            fireConfetti();
        }

        s.history.push({d: s.day, v: val, orig: s.sug, t: 'd', split: s.isSplit});
        s.day++; s.roll = null; histLimit = 7;
        checkWin();
        save(); render();
    }

    function skip() {
        if(s.totalFrags >= 1) {
            tg.HapticFeedback.notificationOccurred('error');
            s.totalFrags = Number((s.totalFrags - 1).toFixed(2));
            s.history.push({d: s.day, v: 0, orig: s.sug, t: 's'});
            s.day++; s.roll = null; histLimit = 7;
            save(); render();
        }
    }

    load();
</script>
</body>
</html>
