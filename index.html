<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Million Goal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #000000);
            --tg-card: var(--tg-theme-secondary-bg-color, #1c1c1d);
            --tg-text: var(--tg-theme-text-color, #ffffff);
            --tg-hint: var(--tg-theme-hint-color, #8e8e93);
            --tg-link: var(--tg-theme-button-color, #007aff);
            --success: #34c759;
            --warning: #ff9500;
            --error: #ff3b30;
        }

        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--tg-bg);
            color: var(--tg-text);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }

        /* Центровка по вертикали */
        .wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
            padding: 0 16px;
            box-sizing: border-box;
            /* Учет "челки" и нижней полоски */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .card {
            background: var(--tg-card);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 12px;
            width: 100%;
            box-sizing: border-box;
        }

        .label { color: var(--tg-hint); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Клик на сумму для сброса */
        .balance { 
            font-size: 34px; font-weight: 800; margin: 4px 0; cursor: pointer;
            transition: opacity 0.2s;
        }
        .balance:active { opacity: 0.5; }

        .progress-track { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin: 15px 0; }
        .progress-bar { height: 100%; width: 0%; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.4s; }

        .status-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 12px 16px; border-radius: 18px; }
        
        .dots { display: flex; gap: 5px; margin-top: 5px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.12); position: relative; overflow: hidden; }
        .dot-fill { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: var(--success); transition: height 0.3s; }

        .dice { font-size: 60px; text-align: center; margin: 10px 0; line-height: 1; }
        .input-sum {
            width: 100%; background: #000; border: 2px solid transparent; border-radius: 14px;
            padding: 14px; color: #fff; font-size: 26px; font-weight: 700;
            text-align: center; margin-bottom: 12px; outline: none;
        }
        .input-sum:focus { border-color: var(--tg-link); }

        .btn { border: none; border-radius: 16px; padding: 18px; font-size: 17px; font-weight: 700; cursor: pointer; width: 100%; transition: 0.1s; }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        .btn-main { background: var(--tg-link); color: #fff; }
        .btn-split { background: var(--warning); color: #fff; margin-bottom: 8px; }
        .btn-skip { background: rgba(255,255,255,0.1); color: var(--tg-link); }
        .btn:disabled { opacity: 0.3; filter: grayscale(1); }

        .history { max-height: 120px; overflow-y: auto; }
        .hist-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 0.5px solid rgba(255,255,255,0.08); font-size: 15px; }
        .c-green { color: var(--success); }
        .c-red { color: var(--error); }
        .c-orange { color: var(--warning); }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="card">
        <div style="display:flex; justify-content:space-between;">
            <div class="label" id="ui-day">День 1 / 400</div>
            <div class="label" id="ui-pct">0%</div>
        </div>
        <div class="balance" id="ui-saved" onclick="secretReset()">0 ₽</div>
        <div class="progress-track"><div class="progress-bar" id="ui-bar"></div></div>
        
        <div class="status-row">
            <div>
                <div class="label">Жизни</div>
                <div style="font-size:24px; font-weight:800;">❤️ <span id="ui-lives">3</span></div>
            </div>
            <div style="text-align:right">
                <div class="label" id="ui-frag-val">Защита 0.00</div>
                <div class="dots" id="ui-dots"></div>
            </div>
        </div>
    </div>

    <div class="card" id="game-card"></div>

    <div class="card">
        <div class="label" style="margin-bottom:8px;">История (Топ-3)</div>
        <div id="ui-hist" class="history"></div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const GOAL = 1000000, DAYS = 400, FRAGS_PER_LIFE = 6;
    let s = { day: 1, saved: 0, totalFrags: 18.0, roll: null, sug: 0, isSplit: false, history: [] };

    // Инициализация точек
    const dotsContainer = document.getElementById('ui-dots');
    dotsContainer.innerHTML = Array(6).fill('<div class="dot"><div class="dot-fill"></div></div>').join('');

    async function load() {
        tg.CloudStorage.getItem('m_goal_v33', (err, val) => {
            if(!err && val) s = JSON.parse(val);
            render();
        });
    }

    function save() {
        tg.CloudStorage.setItem('m_goal_v33', JSON.stringify(s));
    }

    function secretReset() {
        tg.showConfirm("Ты действительно хочешь ПОЛНОСТЬЮ СБРОСИТЬ весь прогресс?", (ok) => {
            if(ok) {
                s = { day: 1, saved: 0, totalFrags: 18.0, roll: null, sug: 0, isSplit: false, history: [] };
                save();
                render();
                tg.HapticFeedback.notificationOccurred('warning');
            }
        });
    }

    function render() {
        const lives = Math.floor(s.totalFrags / FRAGS_PER_LIFE);
        const rem = (s.totalFrags % FRAGS_PER_LIFE);
        
        document.getElementById('ui-day').innerText = `ДЕНЬ ${s.day} / ${DAYS}`;
        document.getElementById('ui-saved').innerText = s.saved.toLocaleString() + ' ₽';
        document.getElementById('ui-lives').innerText = lives;
        document.getElementById('ui-frag-val').innerText = `ЗАЩИТА ${rem.toFixed(2)}`;
        
        const pctA = (s.saved / GOAL) * 100;
        const pctI = (s.day / DAYS) * 100;
        document.getElementById('ui-pct').innerText = Math.floor(pctA) + '%';
        
        const bar = document.getElementById('ui-bar');
        bar.style.width = Math.min(pctA, 100) + '%';
        bar.style.backgroundColor = pctA > pctI + 0.1 ? 'var(--success)' : (pctA < pctI - 0.1 ? 'var(--error)' : 'var(--tg-link)');

        const fills = document.querySelectorAll('.dot-fill');
        fills.forEach((f, i) => {
            let v = rem - i;
            f.style.height = v >= 1 ? '100%' : (v > 0 ? (v * 100) + '%' : '0%');
        });

        const gc = document.getElementById('game-card');
        if(!s.roll) {
            gc.innerHTML = `<button class="btn btn-main" onclick="roll()">🎲 БРОСИТЬ КУБИК</button>`;
        } else {
            gc.innerHTML = `
                <div class="dice">${["", "⚀", "⚁", "⚂", "⚃", "⚄", "⚅"][s.roll]}</div>
                <input type="number" class="input-sum" id="sum-in" value="${s.sug}" inputmode="numeric">
                ${(s.sug > 2000 && !s.isSplit) ? `<button class="btn btn-split" onclick="split()">✂️ СПЛИТ (-0.5 фр.)</button>` : ''}
                <div style="display:flex; gap:10px">
                    <button class="btn btn-skip" id="skip-btn" onclick="skip()">ПРОПУСК</button>
                    <button class="btn btn-main" onclick="done()">ВНЕСТИ</button>
                </div>
            `;
            document.getElementById('skip-btn').disabled = s.totalFrags < 1;
        }

        document.getElementById('ui-hist').innerHTML = s.history.slice(-3).reverse().map(h => {
            let cls = h.t === 's' ? 'c-red' : (h.split ? 'c-orange' : (h.v >= h.orig ? 'c-green' : 'c-red'));
            return `<div class="hist-item">
                <span style="color:var(--tg-hint)">День ${h.d}</span>
                <span class="${cls}">${h.t === 's' ? 'Пропуск' : h.v.toLocaleString() + ' ₽'}</span>
            </div>`;
        }).join('');
    }

    function roll() {
        tg.HapticFeedback.impactOccurred('light');
        s.roll = Math.floor(Math.random() * 6) + 1;
        const avg = (GOAL - s.saved) / (DAYS + 1 - s.day);
        const m = {1:0.5, 2:0.7, 3:0.9, 4:1.1, 5:1.2, 6:1.4};
        s.sug = Math.round((avg * m[s.roll])/50)*50;
        s.isSplit = false;
        render();
    }

    function split() {
        if(s.totalFrags >= 0.5) {
            tg.HapticFeedback.notificationOccurred('warning');
            s.totalFrags = Number((s.totalFrags - 0.5).toFixed(2));
            s.sug = Math.floor(s.sug / 2);
            s.isSplit = true;
            render();
        }
    }

    function done() {
        const val = parseInt(document.getElementById('sum-in').value) || 0;
        if(val >= s.sug) tg.HapticFeedback.impactOccurred('heavy');
        else tg.HapticFeedback.impactOccurred('medium');

        s.saved += val;
        s.totalFrags = Number((s.totalFrags + 0.1).toFixed(2));
        s.history.push({d: s.day, v: val, orig: s.sug, t: 'd', split: s.isSplit});
        s.day++; s.roll = null;
        save(); render();
    }

    function skip() {
        if(s.totalFrags >= 1) {
            tg.HapticFeedback.notificationOccurred('error');
            s.totalFrags = Number((s.totalFrags - 1).toFixed(2));
            s.history.push({d: s.day, v: 0, orig: s.sug, t: 's'});
            s.day++; s.roll = null;
            save(); render();
        }
    }

    load();
</script>
</body>
</html>
